name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests de la couche de calcul
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/MoleculeEfficienceTracker.Tests/MoleculeEfficienceTracker.Tests.csproj

      - name: Build
        run: dotnet build tests/MoleculeEfficienceTracker.Tests/MoleculeEfficienceTracker.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/MoleculeEfficienceTracker.Tests/MoleculeEfficienceTracker.Tests.csproj -c Release --no-build --logger "console;verbosity=detailed"

  android:
    name: Compilation Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Charge de travail MAUI Android
        run: dotnet workload install maui-android

      - name: Plateforme Android 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: dotnet build MoleculeEfficienceTracker.csproj -f net10.0-android36.0 -c Release
